<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Rip Portal — Offline</title>
<style>
  html,body{margin:0;height:100%;background:#030306;color:#e4e4e7;font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));text-align:center;box-sizing:border-box}
  img{width:120px;height:120px;border-radius:28px;margin-bottom:20px}
  h1{font-size:22px;margin:0 0 8px;color:#86efac}
  p{margin:0 0 6px;color:#a1a1aa;max-width:320px}
  button{margin-top:20px;font:600 16px -apple-system,system-ui,sans-serif;color:#030306;background:#86efac;border:0;border-radius:14px;padding:14px 28px;min-width:180px}
  small{margin-top:16px;color:#71717a;font-size:13px}
</style>
</head>
<body>
<main>
  <img src="swirl.png" alt="">
  <h1>You're offline</h1>
  <p>Rip Portal needs a connection to load prices and EV.</p>
  <p>Prices are never shown from an old copy, so nothing here is stale.</p>
  <button id="retry" type="button">Try again</button>
  <small id="status" aria-live="polite"></small>
</main>
<script>
  var SITE = "https://www.ripsportal.com/";
  function go(){
    document.getElementById("status").textContent = "Connecting…";
    window.location.replace(SITE);
  }
  document.getElementById("retry").addEventListener("click", go);
  window.addEventListener("online", go);
</script>
</body>
</html>
